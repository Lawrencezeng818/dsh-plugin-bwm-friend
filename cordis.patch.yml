# dsh-plugin-bwm-friend bundle patch（Publish Preparation）
#
# 只做加法：insert host 插件 + invariant companion。
# client 半经 package.json 的 dsh.client manifest 由 host 自动扫描加载。
# ⚠️ invariant 条目不声明 inject：invariants 是可选 service（宿主可能未加载），
#    由 invariant.js 内 ctx.get('invariants') 安全读取——声明必需会 boot pending（实测）。
- insert:
    - id: bwm-friend
      name: 'dsh-plugin-bwm-friend'
      inject: ['webServer']
    - id: bwm-friend-invariant
      name: 'dsh-plugin-bwm-friend/invariant'
      disabled: false
    # 部署级组件（含本机专属默认域），不随 npm 包发布——随包默认停用，
    # 不得活跃引用包外文件；部署侧经 profile 用户层 patch 显式复启用
    # （启用步骤见仓库根 factgate.js 头注；exports['./factgate'] 保留，
    # 供 link:/检出形态的部署解析）。
    - id: bwm-friend-factgate
      name: 'dsh-plugin-bwm-friend/factgate'
      disabled: true
